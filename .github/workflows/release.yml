name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write  # 创建 Release、上传 asset

env:
  GO_VERSION: "1.23"
  WAILS_VERSION: "v2.11.0"
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: "off"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 · 测试（发布前必须过）
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: 发布前测试
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史生成 changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Go test
        run: CGO_ENABLED=0 go test -count=1 ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 · 构建 arm64 + universal
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: macos-latest
    needs: test
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/arm64
            artifact: CF-Auto-Desktop-macos-arm64
            asset_name: CF-Auto-Desktop-macos-arm64.app.zip
          - platform: darwin/universal
            artifact: CF-Auto-Desktop-macos-universal
            asset_name: CF-Auto-Desktop-macos-universal.app.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-cli-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Add Wails to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.platform }}
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Prepare release asset
        run: |
          APP="build/bin/CF Auto Desktop.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未生成 .app"
            exit 1
          fi
          # 用 ditto 打 zip（保留 macOS 元数据、symlink、签名）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${{ matrix.asset_name }}"
          # 生成 SHA256
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          echo "## ${{ matrix.artifact }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`.app\` 体积：$(du -sh "$APP" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- 压缩包：$(du -sh "${{ matrix.asset_name }}" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256：\`$(cut -d' ' -f1 "${{ matrix.asset_name }}.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 · 生成 Release Notes
  # ─────────────────────────────────────────────────────────────────────────
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # 取上一个 tag 作为起点
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-merges)
          else
            LOG=$(git log --oneline --no-merges "$PREV_TAG"..HEAD)
          fi

          # 写 Release Notes
          cat > /tmp/release-notes.md <<EOF
          ## CF Auto Desktop ${{ github.ref_name }}

          ### 📦 安装方式
          下载对应架构的 \`.zip\`，解压后得到 \`CF Auto Desktop.app\`：
          - **Apple Silicon (M 系列)** → \`CF-Auto-Desktop-macos-arm64.app.zip\`
          - **Intel + Apple Silicon** → \`CF-Auto-Desktop-macos-universal.app.zip\`

          **未做 Apple 签名/公证**，首次打开需右键 → 打开（或在系统设置中允许）。

          ### 🔧 技术栈
          Go 1.23 · Wails v2 · WKWebView · 前端原生 HTML/CSS/JS

          ### 📝 变更记录
          $(echo "$LOG")

          ### ✅ 校验
          每个 \`.zip\` 附 \`.sha256\` 文件，可运行 \`shasum -c <file>.sha256\` 验证完整性。
          EOF

          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
